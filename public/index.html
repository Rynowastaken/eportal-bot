<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NUTC Portal</title>
    <script src="/tailwind-config.js?v=2"></script>
    <script src="/vendor/tailwindcss-3.4.17.js"></script>
    <script src="/vendor/lucide-1.24.0.min.js"></script>
  </head>
  <body
    class="min-h-screen overflow-x-hidden bg-[#141018] font-sans text-[var(--foreground)] antialiased"
  >
    <div
      id="portalBackdrop"
      class="fixed inset-0 -z-20 bg-cover bg-center bg-fixed"
      aria-hidden="true"
    ></div>
    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-[linear-gradient(180deg,rgba(20,16,24,.10),rgba(20,16,24,.68))]"
      aria-hidden="true"
    ></div>

    <main
      class="mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-5 px-4 py-4 sm:px-6 sm:py-5 lg:px-8"
    >
      <header class="flex min-h-14 items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <div
            class="grid h-12 w-12 shrink-0 place-items-center rounded-[18px] border border-[var(--primary-ring)] bg-[var(--primary-soft)] text-[var(--primary)] shadow-sm"
            aria-hidden="true"
          >
            <i data-lucide="graduation-cap" class="h-5 w-5"></i>
          </div>
          <div class="min-w-0">
            <p
              class="truncate text-[11px] font-semibold tracking-[0.08em] text-[var(--muted)]"
            >
              國立臺中科技大學
            </p>
            <h1 class="mt-0.5 truncate text-xl font-semibold tracking-[-0.035em] sm:text-2xl">
              NUTC Portal
            </h1>
          </div>
        </div>

        <div class="flex shrink-0 items-center gap-2">
          <div id="serverMenu" class="relative z-50">
          <button
            id="serverStatusButton"
            class="focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)] inline-flex min-h-[42px] items-center gap-2 rounded-xl border border-[var(--control-border)] bg-[var(--control-bg)] px-3 text-sm font-semibold text-[var(--control-text)] shadow-sm transition duration-150 hover:-translate-y-px hover:border-[var(--control-hover-border)] hover:bg-[var(--control-hover-bg)] hover:text-[var(--control-hover-text)]"
            type="button"
            aria-label="Server ePortal 登入狀態"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span
              id="serverStatusDot"
              class="h-2.5 w-2.5 rounded-full bg-[var(--accent)] shadow-[0_0_0_4px_rgba(255,255,255,.06)]"
            ></span>
            <span id="serverStatusText">檢查中</span>
            <i
              id="serverStatusChevron"
              data-lucide="chevron-down"
              class="h-4 w-4 opacity-60 transition-transform duration-150"
              aria-hidden="true"
            ></i>
          </button>

          <div
            id="serverStatusMenu"
            class="pointer-events-none invisible absolute right-0 top-[calc(100%+.65rem)] w-56 origin-top-right -translate-y-2 scale-[.97] rounded-[20px] border border-white/[.12] bg-[rgba(14,12,16,.92)] p-2 opacity-0 shadow-[0_16px_42px_rgba(0,0,0,.38)] backdrop-blur-[22px] backdrop-saturate-[170%] transition duration-200 ease-soft-out"
            role="menu"
            aria-label="ePortal 選單"
            aria-hidden="true"
          >
            <div class="grid gap-2">
              <button
                id="serverLoginAction"
                class="focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)] flex min-h-[52px] w-full items-center gap-3 rounded-[14px] border border-white/[.12] bg-white/[.07] px-3 text-left text-sm font-semibold transition duration-150 hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10]"
                type="button"
                role="menuitem"
              >
                <i data-lucide="log-in" class="h-5 w-5 text-[var(--primary)]"></i>
                <span>重新登入</span>
              </button>

              <button
                id="serverLogoutAction"
                class="focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)] hidden min-h-[52px] w-full items-center gap-3 rounded-[14px] border border-[#f07178]/20 bg-[#f07178]/[.07] px-3 text-left text-sm font-semibold text-[#f4a0a5] transition duration-150 hover:-translate-y-px hover:border-[#f07178]/30 hover:bg-[#f07178]/[.11]"
                type="button"
                role="menuitem"
              >
                <i data-lucide="log-out" class="h-5 w-5"></i>
                <span>登出</span>
              </button>
            </div>
          </div>

          </div>

          <div id="settingsMenu" class="relative z-50">
            <button
              id="settingsButton"
              class="grid h-[42px] w-[42px] place-items-center rounded-xl border border-white/[.12] bg-white/[.07] text-[var(--foreground)] shadow-sm transition duration-150 hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
              type="button"
              aria-label="外觀設定"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <i data-lucide="settings-2" class="h-5 w-5"></i>
            </button>

            <div
              id="settingsPanel"
              class="pointer-events-none invisible absolute right-0 top-[calc(100%+.65rem)] w-56 origin-top-right -translate-y-2 scale-[.97] rounded-[20px] border border-white/[.12] bg-[rgba(14,12,16,.92)] p-2 opacity-0 shadow-[0_16px_42px_rgba(0,0,0,.38)] backdrop-blur-[22px] backdrop-saturate-[170%] transition duration-200 ease-soft-out"
              role="menu"
              aria-label="外觀設定"
              aria-hidden="true"
            >
              <div class="grid gap-2">
                <button
                  id="themeSettingsAction"
                  class="flex min-h-[52px] w-full items-center gap-3 rounded-[14px] border border-white/[.12] bg-white/[.07] px-3 text-left text-sm font-semibold transition duration-150 hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
                  type="button"
                  role="menuitem"
                >
                  <i data-lucide="palette" class="h-5 w-5 text-[var(--primary)]"></i>
                  <span>Color scheme</span>
                </button>

                <button
                  id="backgroundAction"
                  class="flex min-h-[52px] w-full items-center gap-3 rounded-[14px] border border-white/[.12] bg-white/[.07] px-3 text-left text-sm font-semibold transition duration-150 hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
                  type="button"
                  role="menuitem"
                >
                  <i data-lucide="image-up" class="h-5 w-5 text-[var(--primary)]"></i>
                  <span>背景圖片</span>
                </button>

                <button
                  id="clearBackgroundAction"
                  class="hidden min-h-[52px] w-full items-center gap-3 rounded-[14px] border border-white/[.12] bg-white/[.07] px-3 text-left text-sm font-semibold transition duration-150 hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
                  type="button"
                  role="menuitem"
                >
                  <i data-lucide="image-minus" class="h-5 w-5 text-[var(--primary)]"></i>
                  <span>移除背景</span>
                </button>
              </div>
            </div>

            <input
              id="backgroundInput"
              class="sr-only"
              type="file"
              accept="image/*"
              tabindex="-1"
            />
          </div>
        </div>
      </header>

      <section class="mt-5">
        <div class="mb-3 px-1">
          <h2 class="text-sm font-semibold tracking-[-0.02em] text-[var(--muted)]">
            校務系統
          </h2>
        </div>

        <section
          id="moduleGrid"
          class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5"
          aria-live="polite"
        ></section>
      </section>
    </main>

    <dialog
      id="themeDialog"
      class="fixed inset-0 m-auto w-[calc(100%_-_1.5rem)] max-w-xl bg-transparent p-0 text-[var(--foreground)] backdrop:bg-black/65 backdrop:backdrop-blur-sm"
    >
      <section
        class="rounded-[20px] border border-white/[.12] bg-[rgba(14,12,16,.94)] p-4 shadow-[0_24px_80px_rgba(0,0,0,.46)] backdrop-blur-[22px] backdrop-saturate-[170%] sm:p-5"
      >
        <header class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <div
              class="grid h-11 w-11 shrink-0 place-items-center rounded-[14px] border border-[var(--primary-ring)] bg-[var(--primary-soft)] text-[var(--primary)]"
              aria-hidden="true"
            >
              <i data-lucide="palette" class="h-5 w-5"></i>
            </div>
            <div>
              <h2 class="text-lg font-semibold tracking-[-0.025em]">
                Color scheme
              </h2>
              <p class="mt-0.5 text-xs font-medium text-[var(--muted)]">
                Generated from your background palette.
              </p>
            </div>
          </div>

          <button
            id="themeDialogClose"
            class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-white/[.12] bg-white/[.07] text-[var(--muted)] transition hover:border-white/[.18] hover:bg-white/[.10] hover:text-[var(--foreground)] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
            type="button"
            aria-label="Close color scheme settings"
          >
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </header>

        <div
          id="themeSchemeOptions"
          class="mt-5 grid grid-cols-2 gap-2 sm:grid-cols-3"
          role="radiogroup"
          aria-label="Color scheme"
        ></div>

        <div class="mt-5">
          <p class="text-xs font-semibold text-[var(--muted)]">Preview</p>
          <div
            id="themePreview"
            class="mt-2 grid h-11 grid-cols-5 overflow-hidden rounded-xl border border-white/[.12]"
            aria-label="Generated color preview"
          ></div>
        </div>

        <div class="mt-5 grid gap-4">
          <label class="grid gap-2">
            <span class="flex items-center justify-between gap-3 text-sm font-semibold">
              <span>Colorfulness</span>
              <output
                id="themeColorfulnessValue"
                class="text-xs font-semibold tabular-nums text-[var(--muted)]"
                for="themeColorfulness"
              >1</output>
            </span>
            <input
              id="themeColorfulness"
              class="h-2 w-full cursor-pointer accent-[var(--primary)]"
              type="range"
              min="0.5"
              max="1.5"
              step="0.05"
              value="1"
            />
          </label>

          <label class="grid gap-2">
            <span class="flex items-center justify-between gap-3 text-sm font-semibold">
              <span>Brightness</span>
              <output
                id="themeBrightnessValue"
                class="text-xs font-semibold tabular-nums text-[var(--muted)]"
                for="themeBrightness"
              >1</output>
            </span>
            <input
              id="themeBrightness"
              class="h-2 w-full cursor-pointer accent-[var(--primary)]"
              type="range"
              min="0.5"
              max="1.5"
              step="0.05"
              value="1"
            />
          </label>
        </div>

        <footer class="mt-6 flex flex-wrap justify-end gap-2">
          <button
            id="themeReset"
            class="min-h-[44px] rounded-xl border border-white/[.12] bg-white/[.07] px-4 text-sm font-semibold transition hover:-translate-y-px hover:border-white/[.18] hover:bg-white/[.10] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
            type="button"
          >
            Reset
          </button>
          <button
            id="themeApply"
            class="min-h-[44px] rounded-xl border border-[var(--control-border)] bg-[var(--control-bg)] px-4 text-sm font-semibold text-[var(--control-text)] shadow-sm transition hover:-translate-y-px hover:border-[var(--control-hover-border)] hover:bg-[var(--control-hover-bg)] hover:text-[var(--control-hover-text)] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[var(--primary-ring)]"
            type="button"
          >
            Apply
          </button>
        </footer>
      </section>
    </dialog>

    <script src="/theme.js?v=3"></script>
    <script src="/app.js?v=24" type="module"></script>
  </body>
</html>
