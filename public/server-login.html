<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>登入 ePortal · NUTC Portal</title>
    <link rel="stylesheet" href="/server-login.css?v=4" />
  </head>
  <body>
    <main class="login-shell">
      <header class="login-header">
        <button id="closeButton" class="back-button" type="button">← 返回</button>
        <h1>登入 ePortal</h1>
      </header>

      <section class="status-bar">
        <span id="statusDot" class="status-dot checking"></span>
        <strong id="statusTitle">準備登入…</strong>
      </section>

      <section id="pageCard" class="page-card hidden">
        <h2 id="pageTitle">ePortal</h2>

        <div id="messageList" class="message-list"></div>
        <div id="imageList" class="image-list"></div>

        <form id="bridgeForm" autocomplete="on">
          <div id="fieldList" class="field-list"></div>
          <div id="actionList" class="action-list"></div>
        </form>
      </section>

      <section id="errorCard" class="error-card hidden">
        <h2>無法登入</h2>
        <p id="errorMessage"></p>
        <a href="/" class="primary-link">回到首頁</a>
      </section>
    </main>

    <script src="/server-login.js?v=5" type="module"></script>
  </body>
</html>
